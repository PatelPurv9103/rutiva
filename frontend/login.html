<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Routiva</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-page">

    <div class="login-container" style="max-width: 460px;">

        <a href="index.html" class="subscription-brand">
            <img src="images/routiva-logo.png" alt="Routiva Logo" class="logo" style="margin: 0 auto 12px auto;">
        </a>

        <h1>Welcome Back!</h1>
        <p class="login-subtitle">Login to manage your rides, wallet, and commute subscriptions</p>

        <!-- Quick 1-Click Demo Login Buttons -->
        <div style="background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 10px; padding: 14px; margin-bottom: 22px;">
            <span style="font-size: 0.8rem; font-weight: 700; color: #475569; text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 8px;">
                ⚡ 1-Click Quick Demo Login:
            </span>
            <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                <button type="button" id="quickLoginPassenger" style="flex: 1; padding: 8px 12px; background: #2563eb; color: #fff; border: none; border-radius: 6px; font-weight: 600; font-size: 0.82rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;">
                    👤 Passenger (Priyanshi - ₹500)
                </button>
                <button type="button" id="quickLoginDriver" style="flex: 1; padding: 8px 12px; background: #0f172a; color: #fff; border: none; border-radius: 6px; font-weight: 600; font-size: 0.82rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;">
                    🚗 Driver (Rahul Patel)
                </button>
            </div>
        </div>

        <form id="loginForm">

            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="e.g. priyanshi@gmail.com"
                    value="priyanshi@gmail.com"
                    required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    value="password123"
                    required>
            </div>

            <div class="forgot-password">
                <a href="#">Forgot Password?</a>
            </div>

            <button type="submit" class="login-submit" style="margin-top: 10px;">
                Login to Routiva
            </button>

        </form>

        <p class="signup-text" style="margin-top: 18px;">
            Don't have an account?
            <a href="signup.html">Sign Up here</a>
        </p>

        <a href="index.html" class="back-home" style="display: block; text-align: center; margin-top: 15px; color: #64748b; text-decoration: none; font-size: 0.9rem;">
            ← Back to Home
        </a>

    </div>

    <script src="js/script.js"></script>

</body>
</html>
