spring.application.name=rideloop
server.port=8080

# ========================================================
# Active Profile:
# 'dev'   -> Runs out-of-the-box with in-memory DB (H2 in MySQL mode)
# 'mysql' -> Connects to local MySQL database (rideloop_db on port 3306)
# ========================================================
spring.profiles.active=dev

# ========================================================
# File Storage & Export Directory
# ========================================================
rideloop.storage.export-dir=./exports

# Logging
logging.level.com.rideloop=INFO
